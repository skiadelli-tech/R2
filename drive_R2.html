<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Robot Remote R2</title>

<style>
 body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: #e85b1b;
  font-family: system-ui, -apple-system, sans-serif;
  color: #fff;
  touch-action: none;
  overflow-y: auto;
  padding: 40px 0;
}

  .app { 
    width: min(400px, 92vw); 
    display: flex;
    flex-direction: column;
    gap: 25px;
  }

  .topbar {
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    padding: 0 5px;
  }

  .statusBox {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .status { 
    font-weight: 900; 
    font-size: 20px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
  }

  /* Όνομα Bluetooth του ρομπότ */
  .deviceName {
    display: none;
    font-weight: 800;
    font-size: 15px;
    background: rgba(0,0,0,0.25);
    padding: 4px 10px;
    border-radius: 10px;
    letter-spacing: 0.5px;
  }
  .deviceName.show { display: inline-block; }

  /* Γενικό στυλ κουμπιών για μέγιστο contrast */
  button {
    border: 0;
    border-radius: 18px;
    background: #2d2d2d; /* Σκούρο ανθρακί για αντίθεση */
    color: #ffffff;      /* Απόλυτο λευκό */
    font-weight: 800;
    cursor: pointer;
    user-select: none;
    touch-action: none;
    box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    transition: transform 0.1s;
  }

  button:active {
    transform: scale(0.95);
    background: #1a1a1a;
  }

  .connect { 
    padding: 12px 24px; 
    border-radius: 50px;
    background: #ffffff;
    color: #e85b1b;
    font-size: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }

  /* PAD - Κίνηση */
  .pad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    width: 90%;
    margin: 0 auto;
  }

  .btn {
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    font-size: 36px; /* Μεγάλα και καθαρά βέλη */
  }

  .center {
    background: #ffffff;
    color: #e85b1b;
    font-size: 30px;
    border-radius: 50%;
    aspect-ratio: 1;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }

  /* LIGHTS - Φώτα & Χρώματα */
  .lights {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .lightsRow {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .lightBtn {
    padding: 18px 5px;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .lightBtn.rear.isOn { background: #ff1744; border: 3px solid #fff; }
  .lightBtn.front.isOn { background: #00e676; border: 3px solid #fff; color: #000; }

  /* RGB Χρώματα - Πιο έντονα */
  .colorRow {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    background: rgba(255,255,255,0.15); /* Light frame */
    padding: 10px;
    border-radius: 20px;
  }

  .swatch {
    height: 45px;
    border-radius: 12px;
    background: #f0f0f0; /* Ανοιχτό φόντο για να "δείχνουν" τα χρώματα */
    border: 2px solid transparent;
    display: grid;
    place-items: center;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }

  .dot {
    width: 22px; height: 22px; border-radius: 50%;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
  }
  .dot-w { background: #ffffff; border: 1px solid #ccc; }
  .dot-r { background: #ff0000; }
  .dot-g { background: #00ff00; }
  .dot-b { background: #0000ff; }
  .dot-a { background: #ff9100; }
  .dot-p { background: #d500f9; }
  .dot-c { background: #00e5ff; }

  .swatch.isActive { 
    border-color: #ffffff; 
    background: #ffffff;
    transform: scale(1.1);
    box-shadow: 0 0 15px rgba(255,255,255,0.6);
  }
  
  .disabled { opacity: 0.2; pointer-events: none; filter: grayscale(1); }
  
.license{
  width:100%;
  text-align:center;
  margin-top:40px;
  padding:20px 0;
  font-size:13px;
  color:#ffffffcc;
  line-height:1.6;
  flex-basis:100%;
  
}
</style>
</head>

<body>
<div class="app">
  <div class="topbar">
    <div class="statusBox">
      <div class="status" id="status">Αποσύνδεση</div>
      <div class="deviceName" id="deviceName"></div>
    </div>
    <button class="connect" id="connect">Σύνδεση</button>
  </div>

  <div class="pad disabled" id="pad">
    <button class="btn" data-cmd="E">↖</button>
    <button class="btn" data-cmd="U">↑</button>
    <button class="btn" data-cmd="Q">↗</button>

    <button class="btn" data-cmd="L">←</button>
    <button class="center" id="buzzer">🔊</button>
    <button class="btn" data-cmd="R">→</button>

    <div></div>
    <button class="btn" data-cmd="D">↓</button>
    <div></div>
  </div>

  <div class="lights disabled" id="lights">
    <div class="lightsRow">
      <button id="rearLight" class="lightBtn rear">LED (D9)</button>
      <button id="frontLight" class="lightBtn front">RGB LED (D12)</button>
    </div>

    <div class="colorRow" id="colorRow">
      <button class="swatch" data-col="W" title="White"><span class="dot dot-w"></span></button>
      <button class="swatch" data-col="R" title="Red"><span class="dot dot-r"></span></button>
      <button class="swatch" data-col="G" title="Green"><span class="dot dot-g"></span></button>
      <button class="swatch" data-col="B" title="Blue"><span class="dot dot-b"></span></button>
      <button class="swatch" data-col="A" title="Orange"><span class="dot dot-a"></span></button>
      <button class="swatch" data-col="P" title="Purple"><span class="dot dot-p"></span></button>
      <button class="swatch" data-col="C" title="Cyan"><span class="dot dot-c"></span></button>
    </div>
  </div>
 
</div>
</div>  <!-- τέλος του main container της εφαρμογής -->
<footer class="license">
  Robot R2 Web Controller<br>
  © 2026 Maria Skiadelli – Educational Robotics Project<br>
  Εκπαιδευτική χρήση μόνο – Creative Commons CC BY-NC-SA 4.0
</footer>




<script>
/* Το JavaScript παραμένει το ίδιο για τη λειτουργικότητα */
const SERVICE_UUID = "0000ffe0-0000-1000-8000-00805f9b34fb";
const CHAR_UUID    = "0000ffe1-0000-1000-8000-00805f9b34fb";

let device = null;
let chr = null;
let repeatTimer = null;

const pad = document.getElementById("pad");
const lights = document.getElementById("lights");
const statusEl = document.getElementById("status");
const deviceNameEl = document.getElementById("deviceName");
const connectBtn = document.getElementById("connect");

function setUIConnected(isConnected){
  pad.classList.toggle("disabled", !isConnected);
  lights.classList.toggle("disabled", !isConnected);
  statusEl.textContent = isConnected ? "Συνδεδεμένο" : "Αποσύνδεση";
  connectBtn.textContent = isConnected ? "Αποσύνδεση" : "Σύνδεση";

  // Εμφάνιση του ονόματος / ταυτότητας του ρομπότ
  if (isConnected && device) {
    showRobotLabel();
    deviceNameEl.classList.add("show");
  } else {
    robotId = "";
    deviceNameEl.textContent = "";
    deviceNameEl.classList.remove("show");
  }
}

// Ταυτότητα που στέλνει το ίδιο το ρομπότ (εντολή "I" -> "I:DE")
let robotId = "";
let rxBuffer = "";

function showRobotLabel(){
  deviceNameEl.textContent = robotId
    ? "🤖 " + robotId
    : "🤖 " + (device?.name || "Χωρίς όνομα");
}

function onRobotData(event){
  rxBuffer += new TextDecoder().decode(event.target.value);
  let nl;
  while ((nl = rxBuffer.indexOf("\n")) >= 0) {
    const line = rxBuffer.slice(0, nl).trim();
    rxBuffer = rxBuffer.slice(nl + 1);
    if (line.startsWith("I:")) {
      robotId = line.slice(2).trim();
      showRobotLabel();
    }
  }
  if (rxBuffer.length > 200) rxBuffer = "";
}

function onDisconnected(){
  clearInterval(repeatTimer);
  repeatTimer = null;
  chr = null;
  setUIConnected(false);
}

async function connectBLE(){
  try {
    device = await navigator.bluetooth.requestDevice({
      filters:[{services:[SERVICE_UUID]}],
      optionalServices:[SERVICE_UUID]
    });

    device.addEventListener("gattserverdisconnected", onDisconnected);

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    chr = await service.getCharacteristic(CHAR_UUID);

    // Ακούμε τις απαντήσεις του ρομπότ
    try {
      await chr.startNotifications();
      chr.addEventListener("characteristicvaluechanged", onRobotData);
    } catch(e) { console.log("notifications:", e); }

    setUIConnected(true);
    send("S");
    setTimeout(()=>send("I"), 300);   // ζητάμε την ταυτότητα
    setTimeout(()=>{ if (!robotId) send("I"); }, 1200);
  } catch(e) {
    console.log(e);
    if (!chr) setUIConnected(false);
  }
}

function disconnectBLE(){
  try { send("S"); } catch {}
  if (device?.gatt?.connected) device.gatt.disconnect();
  onDisconnected();
}

async function send(c){
  if(!chr) return;
  const data = new TextEncoder().encode(c);
  chr.properties.writeWithoutResponse ? chr.writeValueWithoutResponse(data) : chr.writeValue(data);
}

function startHold(cmd){ send(cmd); clearInterval(repeatTimer); repeatTimer = setInterval(()=>send(cmd),120); }
function stopHold(){ clearInterval(repeatTimer); repeatTimer = null; send("S"); }

document.querySelectorAll(".btn[data-cmd]").forEach(btn=>{
  const cmd = btn.dataset.cmd;
  btn.addEventListener("pointerdown", e=>{ e.preventDefault(); btn.setPointerCapture(e.pointerId); startHold(cmd); });
  btn.addEventListener("pointerup", e=>{ e.preventDefault(); try{ btn.releasePointerCapture(e.pointerId); }catch{} stopHold(); });
  btn.addEventListener("pointercancel", stopHold);
});

document.getElementById("buzzer").onclick = ()=>send("B");

let rearOn = false, frontOn = false;
const rearBtn = document.getElementById("rearLight"), frontBtn = document.getElementById("frontLight"), colorRow = document.getElementById("colorRow");

rearBtn.onclick = ()=>{ rearOn = !rearOn; send(rearOn ? "t" : "u"); rearBtn.classList.toggle("isOn", rearOn); };
frontBtn.onclick = ()=>{ frontOn = !frontOn; send(frontOn ? "f" : "g"); frontBtn.classList.toggle("isOn", frontOn); };

colorRow.querySelectorAll(".swatch").forEach(sw=>{
  sw.onclick = ()=>{
    const col = sw.getAttribute("data-col");
    if(!frontOn){ frontOn = true; send("f"); frontBtn.classList.add("isOn"); }
    send("C" + col);
    colorRow.querySelectorAll(".swatch").forEach(b=>b.classList.remove("isActive"));
    sw.classList.add("isActive");
  };
});
connectBtn.onclick = ()=>{ if (device?.gatt?.connected && chr) disconnectBLE(); else connectBLE(); };
</script>


</body>
</html>
